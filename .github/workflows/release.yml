name: Release

# Baut automatisch drei Betriebssystem-Varianten und veröffentlicht sie als
# GitHub Release, sobald ein Tag im Format v*.*.* gepusht wird (z.B. v1.2.0):
#   - "windows10-11"     : moderner Stack (PySide6, aktuelles Python) für
#                          Windows 10/11.
#   - "windows7-legacy"  : Kompatibilitäts-Build (PyQt5 / Qt 5.15, Python 3.8)
#                          für ältere Laborrechner unter Windows 7. Beachte
#                          die Hinweise in requirements-win7.txt -- dieser
#                          Stack ist bewusst alt/unsupportet.
#   - "linux"            : moderner Stack (PySide6, aktuelles Python) als
#                          einzelne ausführbare Binärdatei für x86_64-Linux
#                          (gebaut/getestet auf Ubuntu; benötigt auf dem
#                          Zielsystem die üblichen Qt-Laufzeitbibliotheken,
#                          siehe README).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: # manuelles Neu-Auslösen zum Debuggen, ohne neu zu taggen

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      # Achtung: setup-uv pflegt seit v8 KEINE gleitenden Major-Tags mehr
      # (@v8/@v9/@v10 existieren nicht, nur @v7 und aelter). Daher muss hier
      # immer eine volle Version stehen -- beim Hochziehen die tatsaechlichen
      # Tags unter github.com/astral-sh/setup-uv/tags pruefen.
      - name: uv installieren
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Abhängigkeiten installieren (inkl. PyInstaller)
        run: uv sync

      - name: Import-Sanity-Check
        run: uv run python -c "import thermal_viewer.main_window"

      - name: Windows-exe bauen
        # --collect-all imageio_ffmpeg/imageio: PyInstaller erkennt die von
        # imageio-ffmpeg zur Laufzeit nachgeladene ffmpeg.exe (und imageios
        # eigene Plugin-Registrierung) nicht automatisch, da main_window.py
        # das Paket bewusst nur lazy innerhalb der Video-Export-Funktion
        # importiert (siehe requirements-win7.txt). Ohne dieses Bundling
        # startete der Video-Export auf einem frischen Rechner ohne lokal
        # installiertes imageio mit einer Fehlermeldung, obwohl das Paket in
        # pyproject.toml als Abhaengigkeit gelistet ist (Bugreport).
        run: >
          uv run pyinstaller --noconfirm --clean --windowed --onefile
          --name ThermalViewer --icon thermal_viewer/resources/icon.ico
          --add-data "thermal_viewer/resources/icon.ico;resources"
          --collect-all imageio_ffmpeg --collect-all imageio run.py

      - name: Release-Archiv schnüren
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path dist/ThermalViewer.exe, README.md, documentation/Bedienungsanleitung.txt, documentation/Tastatur-Shortcuts.txt `
            -DestinationPath "ThermalViewer-$version-windows10-11.zip"

      - name: Archiv hochladen
        uses: actions/upload-artifact@v7
        with:
          name: windows10-11-build
          path: ThermalViewer-*-windows10-11.zip
          retention-days: 7

  build-windows7-legacy:
    runs-on: windows-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Python 3.8 installieren (letzte Win7-kompatible Version)
        uses: actions/setup-python@v7
        with:
          python-version: "3.8"

      - name: Legacy-Abhängigkeiten installieren (PyQt5 / Qt 5.15)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-win7.txt

      - name: Import-Sanity-Check
        run: python -c "import thermal_viewer.main_window"

      - name: Windows-7-exe bauen
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile
          --name ThermalViewer --icon thermal_viewer/resources/icon.ico
          --add-data "thermal_viewer/resources/icon.ico;resources" run.py

      - name: Release-Archiv schnüren
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path dist/ThermalViewer.exe, README.md, documentation/Bedienungsanleitung.txt, documentation/Tastatur-Shortcuts.txt, requirements-win7.txt `
            -DestinationPath "ThermalViewer-$version-windows7-legacy.zip"

      - name: Archiv hochladen
        uses: actions/upload-artifact@v7
        with:
          name: windows7-legacy-build
          path: ThermalViewer-*-windows7-legacy.zip
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      # PySide6/Qt benoetigt diese Laufzeitbibliotheken bereits zum Bauen
      # (PyInstaller analysiert die Qt-Plugins), UND aehnliche Pakete muessen
      # spaeter auch auf dem Zielsystem vorhanden sein, damit die fertige
      # Binärdatei tatsaechlich startet (Qt bringt bei PySide6 zwar seine
      # eigenen Qt-Bibliotheken mit, aber nicht die zugrundeliegenden
      # System-/X11-/EGL-Bibliotheken des Betriebssystems).
      - name: Qt-Systemabhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: uv installieren
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Abhängigkeiten installieren (inkl. PyInstaller)
        run: uv sync

      - name: Import-Sanity-Check
        run: uv run python -c "import thermal_viewer.main_window"

      - name: Linux-Binärdatei bauen
        # --collect-all imageio_ffmpeg/imageio: siehe Kommentar im
        # Windows-Build-Schritt oben -- betrifft den PyInstaller-Onefile-Bau
        # gleichermaßen.
        run: >
          uv run pyinstaller --noconfirm --clean --onefile
          --name ThermalViewer
          --add-data "thermal_viewer/resources/icon.ico:resources"
          --collect-all imageio_ffmpeg --collect-all imageio run.py

      - name: Release-Archiv schnüren
        run: |
          version="${GITHUB_REF_NAME}"
          chmod +x dist/ThermalViewer
          mkdir -p stage
          cp dist/ThermalViewer README.md documentation/Bedienungsanleitung.txt documentation/Tastatur-Shortcuts.txt stage/
          tar -czf "ThermalViewer-$version-linux.tar.gz" -C stage .

      - name: Archiv hochladen
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: ThermalViewer-*-linux.tar.gz
          retention-days: 7

  release:
    needs: [build-windows, build-windows7-legacy, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Archive einsammeln
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: GitHub Release veröffentlichen
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
          generate_release_notes: true
