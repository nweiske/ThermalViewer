[project]
name = "thermal-viewer"
version = "0.1.0"
description = "Interaktiver Viewer für gestapelte Thermokamera-CSV-Messreihen"
requires-python = ">=3.11"
dependencies = [
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.4.6",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.1",
    "qtpy>=2.4.3",
]

[tool.uv]
system-certs = true

[dependency-groups]
dev = [
    "pyinstaller>=6.22.0",
]
