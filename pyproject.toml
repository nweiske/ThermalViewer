[project]
name = "thermal-viewer"
version = "0.1.0"
description = "Interaktiver Viewer für gestapelte Thermokamera-CSV-Messreihen"
requires-python = ">=3.11"
dependencies = [
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.4.6",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.1",
    "qtpy>=2.4.3",
    "tifffile>=2024.1.30",
]

[tool.uv]
system-certs = true

[dependency-groups]
dev = [
    "pyinstaller>=6.22.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Das Projekt ist bewusst kein installierbares Package (kein [build-system],
# siehe run.py, das genauso auf das Projektverzeichnis in sys.path setzt) --
# "." macht thermal_viewer waehrend der Tests trotzdem importierbar, ohne
# extra "pip install -e .".
pythonpath = ["."]
# Bevor irgendein Testmodul Qt importiert, setzt tests/conftest.py
# QT_QPA_PLATFORM=offscreen -- Tests bauen dabei echte QApplication-/
# MainWindow-Instanzen auf, oeffnen aber nie ein sichtbares Fenster (lokal
# wie in CI, unter Windows und Linux gleichermassen).
# tests/smoke_test.py ist ein eigenstaendiges Skript (siehe README, Abschnitt
# "App-Icon"/"Tests" -- Aufruf per "uv run python tests/smoke_test.py"), kein
# pytest-Modul: es fuehrt seine Checks beim Import auf Modulebene direkt aus
# und beendet den Prozess per sys.exit(). Der Dateiname passt zufaellig auf
# pytest's Standard-Suchmuster "*_test.py" -- ohne diesen Ausschluss wuerde
# pytest es einzusammeln versuchen und an dessen sys.exit() abstuerzen.
addopts = "-ra --ignore=tests/smoke_test.py"
